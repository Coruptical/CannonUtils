name: CannonUtils
version: '1.0'
main: com.coruptical.cannonUtils.CannonUtils
api-version: '1.21'
authors: [ Coruptical ]
description: Library of useful cannoning utilities
commands:
  tickcounter:
    aliases:
      - tc
    description: Get a tick counter to count redstone ticks accurately.
  magicsand:
    aliases:
      - ms
    description: Get magic sand to fill your cannons with sand.
  fire:
    description: Fire a cannon by automatically pressing a saved button.
  entitytracker:
    aliases:
      - et
    description: Entity tracker master command
  stackclearer:
    aliases:
      - sc
    description: Get a stack clearer to clear your stacks.
  msclear:
    description: Clear all of your magic sand.
  tntfill:
    aliases:
      - tf
    description: Fill your dispensers with tnt.